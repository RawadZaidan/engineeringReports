{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medilab{% endblock %}</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Medical Equipment Service Report Management System">
    <meta name="theme-color" content="#0891b2">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="icon" type="image/png" sizes="512x512" href="{% static 'icons/icon-512x512.png' %}">
    
    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Medilab">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
    
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=3.0">
</head>
<body>
    <header class="app-header">
        <div class="container">
            <h1 class="logo"><a href="{% url 'dashboard' %}">Medilab</a></h1>
            <button class="menu-toggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <nav class="main-nav">
                <a href="{% url 'dashboard' %}" class="nav-link">Dashboard</a>
                <a href="{% url 'report_create' %}" class="nav-link">New Report</a>
                <a href="{% url 'product_list' %}" class="nav-link">Products</a>
                <a href="{% url 'request_list' %}" class="nav-link">Maintenance Requests</a>
                {% if user.is_authenticated %}
                    <span class="user-greeting">Hi, {{ user.username }}</span>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="{% url 'dashboard' %}" class="bottom-nav-link">
            <span class="bottom-nav-icon">🏠</span>
            <span class="bottom-nav-label">Dashboard</span>
        </a>
        <a href="{% url 'report_create' %}" class="bottom-nav-link">
            <span class="bottom-nav-icon">➕</span>
            <span class="bottom-nav-label">New Report</span>
        </a>
        <a href="{% url 'request_list' %}" class="bottom-nav-link">
            <span class="bottom-nav-icon">🛠️</span>
            <span class="bottom-nav-label">Requests</span>
        </a>
    </nav>

    <footer class="app-footer">
        <div class="container">
            <p>&copy; 2026 Medilab Engineering</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.querySelector('.menu-toggle');
            const mainNav = document.querySelector('.main-nav');
            
            if (menuToggle && mainNav) {
                menuToggle.addEventListener('click', function() {
                    mainNav.classList.toggle('active');
                    menuToggle.classList.toggle('active');
                });
            }
            
            // Register Service Worker for PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('{% static "js/service-worker.js" %}')
                    .then(function(registration) {
                        console.log('Service Worker registered successfully:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('Service Worker registration failed:', error);
                    });
            }
        });
    </script>
</body>
</html>
