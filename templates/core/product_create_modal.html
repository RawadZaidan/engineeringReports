<!--
  Backward-compatibility shell.
  Product creation is now handled directly inside the equipment selector modal.
  This file keeps the #productModal and #quickProductForm IDs alive so that
  any existing JS references in report_form / request_form don't throw errors.
-->
<div id="productModal" style="display:none;">
  <form id="quickProductForm">
    {% csrf_token %}
    <input type="hidden" name="name">
    <input type="hidden" name="category">
    <input type="hidden" name="manufacturer">
    <input type="hidden" name="model">
  </form>
</div>
