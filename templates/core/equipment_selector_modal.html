<div id="equipmentModal" class="modal" style="display:none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4);">
    <div class="modal-content" style="background-color: #fefefe; margin: 10% auto; padding: 25px; border: none; width: 90%; max-width: 500px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h3 style="margin: 0; color: #1e293b;">Register/Add Machine</h3>
            <span class="close-equipment" style="color: #64748b; font-size: 24px; font-weight: bold; cursor: pointer;">&times;</span>
        </div>
        
        <!-- Tab Switcher -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
            <button type="button" id="tab-existing" class="btn btn-sm" style="background: #f1f5f9; color: #475569;">From Registry</button>
            <button type="button" id="tab-new" class="btn btn-sm" style="background: transparent; color: #94a3b8;">New Machine</button>
        </div>

        <!-- Mode A: Selection from Existing Registry -->
        <div id="mode-registry">
            <div class="form-group">
                <label class="form-label">Select from Registry</label>
                <select id="modal_equipment_select" class="form-control equipment-select">
                    <option value="">-- Search Registry --</option>
                    {% for eq in equipments %}
                        <option value="{{ eq.id }}">{{ eq.product.manufacturer }} {{ eq.product.model }} (S/N: {{ eq.serial_number }})</option>
                    {% endfor %}
                </select>
                <small class="text-muted">Only machines already in the database.</small>
            </div>
        </div>

        <!-- Mode B: Quick Create New Registry Entry -->
        <div id="mode-new" style="display: none;">
            <form id="quickEquipmentForm">
                <div class="form-group">
                    <label class="form-label">Product (Catalogue)</label>
                    <div style="display: flex; gap: 8px;">
                        <select id="modal_new_eq_product" name="product" class="form-control" required style="flex:1;">
                            <option value="">-- Choose Type --</option>
                            {% for p in products %}
                            <option value="{{ p.id }}">{{ p.manufacturer }} {{ p.model }}</option>
                            {% endfor %}
                        </select>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('productModal').style.display='block'">+</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Serial Number</label>
                    <input type="text" name="serial_number" class="form-control" placeholder="Enter unique S/N" required>
                </div>
                <div id="eqError" style="color: #ef4444; font-size: 0.85rem; margin-top: 5px;"></div>
            </form>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
            <label class="form-label">Service Note (Optional)</label>
            <input type="text" id="modal_service_note" class="form-control" placeholder="Note for this service only">
        </div>

        <div style="text-align: right; margin-top: 2rem; display: flex; gap: 10px; justify-content: flex-end;">
            <button type="button" class="btn btn-secondary close-equipment-btn">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveEquipmentBtn">Add to Report</button>
        </div>
    </div>
</div>
